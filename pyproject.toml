[project]
name = "kriyex"
version = "0.1.0"
description = "Privacy-first AI desktop operating partner."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pyside6>=6.11.1",
]

[project.scripts]
kriyex = "kriyex.app.main:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
